<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费小工具站</title>
<style>
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:0 auto;padding:24px 16px;color:#222;line-height:1.7}
h1{font-size:26px} h2{font-size:20px;margin-top:36px;border-top:1px solid #ddd;padding-top:16px}
.card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:16px 0}
label{margin-right:12px} input{width:70px;padding:6px}
button{padding:8px 16px;border:0;border-radius:8px;background:#0969da;color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button:active{opacity:.8}
textarea{width:100%;min-height:140px;box-sizing:border-box;padding:10px;font-size:14px}
table{border-collapse:collapse;margin-top:12px} td,th{border:1px solid #999;padding:6px 12px}
.note{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>🛠️ 免费小工具站</h1>
<p>这是一个人人可访问的轻量网站：不用注册、不用登录，有网就能打开使用。所有工具都在你的浏览器里运行，不上传任何数据。</p>

<div class="card">
<h2>表格生成器</h2>
<p class="note">输入行数和列数，点生成，得到 Markdown 表格和网页表格，点复制就能直接用。</p>
<label>行数 <input id="rows" type="number" value="3" min="1" max="20"></label>
<label>列数 <input id="cols" type="number" value="3" min="1" max="10"></label>
<button onclick="gen()">生成表格</button>
<div id="preview"></div>
<p>Markdown：</p>
<textarea id="md" readonly></textarea>
<button onclick="copyMd()">复制 Markdown</button>
</div>

<div class="card">
<h2>点对点传输 · 说明</h2>
<p>点对点传输（WebRTC）不需要服务器中转文件：两个人打开同一个工具页，交换一串握手码，就能直接传文件。完整版正在加入本站，先记住原理：<b>页面是公开的，文件是直连的</b>。</p>
</div>

<p class="note">本站托管于 GitHub Pages，完全免费。想加新工具，告诉站长一声即可。</p>

<script>
function gen(){
  var r=parseInt(document.getElementById('rows').value)||3;
  var c=parseInt(document.getElementById('cols').value)||3;
  r=Math.min(20,Math.max(1,r)); c=Math.min(10,Math.max(1,c));
  var html='<table><tr>'; var md='';
  for(var j=0;j<c;j++){ html+='<th>列'+(j+1)+'</th>'; md+='| 列'+(j+1)+' '; }
  html+='</tr>'; md+='|\n';
  for(var j=0;j<c;j++){ md+='| --- '; } md+='|\n';
  for(var i=0;i<r;i++){
    html+='<tr>';
    for(var j=0;j<c;j++){ html+='<td>内容</td>'; md+='| 内容 '; }
    html+='</tr>'; md+='|\n';
  }
  html+='</table>';
  document.getElementById('preview').innerHTML=html;
  document.getElementById('md').value=md;
}
function copyMd(){
  var t=document.getElementById('md');
  t.select(); document.execCommand('copy');
  alert('已复制 Markdown 表格');
}
gen();
</script>
</body>
</html>
